<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Task Flow</h1>
    <p id="storage-error" class="storage-error" role="alert" hidden></p>

    <form id="task-form" class="task-form" novalidate>
      <div class="form-row">
        <label for="task-title" class="visually-hidden">할 일 제목</label>
        <input id="task-title" name="title" type="text" placeholder="할 일 제목을 입력하세요" autocomplete="off">
        <button type="submit">등록</button>
      </div>
      <label for="task-description" class="visually-hidden">설명</label>
      <textarea id="task-description" name="description" rows="2" placeholder="설명 (선택)"></textarea>
      <div class="form-row">
        <label>
          우선순위
          <select id="task-priority" name="priority">
            <option value="LOW">낮음</option>
            <option value="MEDIUM" selected>보통</option>
            <option value="HIGH">높음</option>
          </select>
        </label>
        <label>
          마감일
          <input id="task-due-date" name="dueDate" type="date">
        </label>
      </div>
    </form>
    <p id="form-error" class="form-error" role="alert" hidden></p>

    <section class="toolbar" aria-label="검색과 필터">
      <label for="search-input" class="visually-hidden">검색</label>
      <input id="search-input" type="search" placeholder="제목·설명 검색" autocomplete="off">
      <label>
        상태
        <select id="status-filter">
          <option value="ALL">전체</option>
          <option value="TODO">할 일</option>
          <option value="IN_PROGRESS">진행 중</option>
          <option value="DONE">완료</option>
        </select>
      </label>
      <label>
        우선순위
        <select id="priority-filter">
          <option value="ALL">전체</option>
          <option value="HIGH">높음</option>
          <option value="MEDIUM">보통</option>
          <option value="LOW">낮음</option>
        </select>
      </label>
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-message" class="empty-message">등록된 할 일이 없습니다.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
